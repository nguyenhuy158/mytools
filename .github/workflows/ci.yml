name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm check (typegen + tsc -b), pnpm build, then `pnpm e2e`: builds, serves
  # build/ with `wrangler dev --local` (remote bindings off, so writes stay in
  # .wrangler/state) and runs both smoke suites. No Cloudflare credentials.
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-build: true
      run-e2e: true

  # Workers Builds only runs `pnpm run build`, so this is the only place the
  # unit tests gate anything. The project suites read the real `projects`
  # table with `wrangler d1 execute --remote` (SELECT only), so they need these
  # repo secrets (token with D1 read on the account), which check.yml cannot
  # pass to its test step.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
